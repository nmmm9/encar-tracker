<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>중고차 추적기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --ink:#191F28; --ink-2:#4E5968; --muted:#8B95A1;
  --bg:#FFFFFF; --soft:#F9FAFB; --line:#E5E8EB;
  --accent:#3182F6;
  --good:#12B76A; --warn:#F79009; --bad:#F04452;
  --down:#3182F6; --up:#F04452;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:28px 20px 60px}
a{color:inherit}

.masthead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
h1{font-size:24px;font-weight:700;margin:0}
.tag{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.stamp{font-size:13px;color:var(--muted);text-align:right}
.stamp b{color:var(--ink);font-weight:600}

.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:28px}
.count{background:var(--soft);border-radius:12px;padding:14px 16px}
.count .k{font-size:13px;color:var(--muted)}
.count .v{font-size:22px;font-weight:700;margin-top:2px}
.count .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}

.layout{display:grid;grid-template-columns:280px 1fr;gap:28px;align-items:start}
@media (max-width:920px){.layout{grid-template-columns:1fr}}
.log h2,.list h2{font-size:17px;font-weight:700;margin:0 0 12px}
.log{position:sticky;top:16px}
@media (max-width:920px){.log{position:static}}
.feed{max-height:72vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px 14px}
.day{font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 4px}
.day:first-child{margin-top:8px}
.ev{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.4}
.ev:last-child{border-bottom:0}
a.ev{text-decoration:none;color:inherit;border-radius:8px;margin:0 -6px;padding-left:6px;padding-right:6px}
a.ev:hover{background:var(--soft)}
a.ev:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;margin-top:5px}
.dot.sold{background:var(--bad)} .dot.hold{background:var(--warn)} .fig.hold{color:#B54708}
.holdtag{display:block;font-size:11.5px;font-weight:700;color:#B54708}
.dot.sold{background:var(--bad)} .dot.price{background:var(--accent)} .dot.new{background:var(--good)}
.ev .txt{min-width:0}
.ev .lbl{color:var(--ink)}
.ev .fig{font-size:12.5px;font-weight:600}
.fig.down{color:var(--down)} .fig.up{color:var(--up)} .fig.sold{color:var(--bad)} .fig.new{color:var(--good)}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:4px;background:var(--soft);border-radius:10px;padding:4px}
.chip{border:0;background:none;font:inherit;font-size:13px;font-weight:500;color:var(--ink-2);
  padding:6px 12px;border-radius:8px;cursor:pointer}
.chip[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type="search"],select{font:inherit;font-size:13px;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:8px 12px}
input[type="search"]{flex:1 1 160px;min-width:120px}
input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:13px;color:var(--muted);margin-left:auto}

.rows{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row,.head{display:grid;grid-template-columns:0 92px minmax(0,1fr) 54px 68px 86px 100px 56px;
  align-items:center;gap:12px;padding:0 16px 0 4px}
.row{padding-top:12px;padding-bottom:12px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.row:last-child{border-bottom:0}
.row:hover{background:var(--soft)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.head{padding-top:10px;padding-bottom:10px;background:var(--soft);border-bottom:1px solid var(--line);
  font-size:12px;font-weight:600;color:var(--muted)}
.ar{text-align:right} .ac{text-align:center}
.stripe{width:0}
.id{font-size:12px;color:var(--muted)}
.name{min-width:0}
.name .b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name .m{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.num{font-size:13px;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.price{font-size:15px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.dep{display:flex;flex-direction:column;gap:4px}
.dep .t{font-size:12px;color:var(--muted);text-align:right}
.track{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent)}
.why{display:flex;flex-direction:column;gap:3px;margin-top:7px;font-size:12.5px;line-height:1.45}
.why .pro{color:#0A8A4F} .why .con{color:#D22030}
.why b{font-weight:700;margin-right:6px}
.gr{font-size:12px;font-weight:700;text-align:center;border-radius:6px;padding:2px 0}
.gr.A{background:#E8F7EF;color:#0A8A4F} .gr.B{background:#FEF3E2;color:#B54708} .gr.C{background:#FDECEE;color:#D22030}
.empty{padding:32px 14px;color:var(--muted);text-align:center}
@media (max-width:760px){
  .row,.head{grid-template-columns:0 minmax(0,1fr) 78px 52px;gap:10px}
  .hide-s{display:none}
}
footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:18px}
footer b{color:var(--ink-2);font-weight:600}
footer code{font-size:12px;background:var(--soft);border-radius:6px;padding:1px 6px}
.pch{font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--soft);border-radius:6px;padding:1px 6px}
#spark{position:fixed;z-index:50;width:300px;background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.10);padding:12px 14px;pointer-events:none;display:none}
#spark .t{font-size:13px;font-weight:700;margin-bottom:6px}
#spark svg{display:block;width:100%;height:auto}
#spark .ax{font-size:10.5px;fill:var(--muted)}
#spark .lb{font-size:11px;font-weight:600;fill:var(--ink)}
#spark ul{list-style:none;margin:8px 0 0;padding:0;font-size:12px;color:var(--ink-2)}
#spark li{display:flex;justify-content:space-between;gap:8px;padding:2px 0;font-variant-numeric:tabular-nums}
#spark li .dn{color:var(--down);font-weight:600} #spark li .up{color:var(--up);font-weight:600}
.views{display:flex;gap:4px;margin:0 0 12px;border-bottom:1px solid var(--line)}
.view{border:0;background:none;font:inherit;font-size:15px;font-weight:600;color:var(--muted);padding:8px 4px 10px;margin-right:14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.view[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.view:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.view .n{font-size:12.5px;font-weight:600;color:var(--muted);margin-left:4px}
.dd{display:block;font-size:12px;font-weight:600;color:var(--down)}
.was{display:block;font-size:11.5px;font-weight:500;color:var(--muted);text-decoration:line-through}
</style>

<div class="wrap">
  <header class="masthead">
    <div>
      <span class="tag">엔카 · 닥신 필터 통과 매물</span>
      <h1>중고차 추적기</h1>

        <span class="hint" id="hint"></span>
      </div>
      <div class="rows">
        <div class="head">
          <span></span>

          <span>차량</span>
          <span class="ar hide-s">연식</span>
          <span class="ar hide-s">주행</span>
          <span class="ar">가격</span>
          <span class="hide-s">신차대비</span>
          <span class="ac">판정</span>
        </div>
        <div id="rows"></div>
      </div>
    </section>
  </div>

  <footer>
    <span><b>판정</b> 추천: 감점 없음 · 보통: 가벼운 흠 1개(자차공백·주인 2번 등) · 비추천: 차체 교환·판금, 최근 사고, 흠 2개 이상</span>
    <span><b>하드 탈락</b> 이력 미공개 · 렌터카 · 전손/침수 · 뼈대수리 · 소유 3회+ · 건당 1,000만 초과 사고</span>
    <span><b>갱신</b> <code>py tracker.py</code></span>
  </footer>
</div>

<script>
(function(){
  var D = JSON.parse(document.getElementById('data').textContent);
  var $ = function(s){ return document.querySelector(s); };
  $('#today').textContent = D.today;
  $('#ndays').textContent = D.days;
  $('#updated').textContent = D.updated.slice(11);

  var soldAll = D.ev.filter(function(e){ return e.t === 'sold'; }).length;
  var byModel = function(m){ return D.cars.filter(function(c){ return c.m === m; }).length; };
  $('#counts').innerHTML = [
    ['추적 중', D.cars.length, '대'],
    ['A6', byModel('A6'), '대'], ['A7', byModel('A7'), '대'],
    ['G80', byModel('G80'), '대'], ['G70', byModel('G70'), '대'], ['아반떼', byModel('아반떼'), '대'],
    ['판매완료 누적', soldAll, '대']
  ].map(function(r){
    return '<div class="count"><div class="k">' + r[0] + '</div><div class="v">' + r[1] + '<small>' + r[2] + '</small></div></div>';
  }).join('');

  var days = [];
  D.ev.forEach(function(e){ if (days.indexOf(e.d) < 0) days.push(e.d); });
  days.sort().reverse();
  var feed = days.map(function(d){
    var list = D.ev.filter(function(e){ return e.d === d; }).map(function(e){
      if (e.t === 'sold') return '<a class="ev" href="https://fem.encar.com/cars/detail/' + e.id + '" target="_blank" rel="noopener"><span class="dot sold"></span><span class="txt"><span class="lbl">' + e.label + '</span><br><span class="fig sold">판매완료 · ' + e.price.toLocaleString() + '만</span></span></a>';
      if (e.t === 'new') return '<a class="ev" href="https://fem.encar.com/cars/detail/' + e.id + '" target="_blank" rel="noopener"><span class="dot new"></span><span class="txt"><span class="lbl">' + e.label + '</span><br><span class="fig new">신규 등록 · ' + e.price.toLocaleString() + '만</span></span></a>';
      if (e.t === 'hold') return '<a class="ev" href="https://fem.encar.com/cars/detail/' + e.id + '" target="_blank" rel="noopener"><span class="dot hold"></span><span class="txt"><span class="lbl">' + e.label + '</span><br><span class="fig hold">계약중 표시 · ' + e.from.toLocaleString() + '만 → ' + e.to.toLocaleString() + '</span></span></a>';
      if (e.t === 'unhold') return '<a class="ev" href="https://fem.encar.com/cars/detail/' + e.id + '" target="_blank" rel="noopener"><span class="dot new"></span><span class="txt"><span class="lbl">' + e.label + '</span><br><span class="fig new">계약 풀림 · ' + e.to.toLocaleString() + '만으로 복귀</span></span></a>';
      var dn = e.to < e.from;
      return '<a class="ev" href="https://fem.encar.com/cars/detail/' + e.id + '" target="_blank" rel="noopener"><span class="dot price"></span><span class="txt"><span class="lbl">' + e.label + '</span><br><span class="fig ' + (dn ? 'down' : 'up') + '">' + e.from.toLocaleString() + ' → ' + e.to.toLocaleString() + '만 (' + (dn ? '' : '+') + (e.to - e.from).toLocaleString() + ')</span></span></a>';
    }).join('');
    return '<div class="day">' + d + '</div>' + list;
  }).join('');
  $('#feed').innerHTML = feed || '<div class="empty">아직 기록된 변동이 없습니다.</div>';

  var state = { m: 'ALL', c: '검정색', g: 'ALL', q: '', sort: 'score', view: 'all' };
  // 처음 본 가격 대비 현재 가격이 내려간 만큼 (판매 보류 표시 9,000만 이상은 제외)
  function dropOf(c){
    if (!c.h) return 0;
    var ps = c.h.map(function(p){ return p[1]; });
    if (!ps.length || c.hold) return 0;
    return ps[0] - c.p;
  }
  function setView(v){
    state.view = v;
    document.querySelectorAll('.view').forEach(function(b){ b.setAttribute('aria-selected', b.dataset.v === v); });
    if (v === 'drop') state.sort = 'drop';
    else if (state.sort === 'drop') state.sort = 'score';
    document.getElementById('sort').value = state.sort;
    try { history.replaceState(null, '', v === 'drop' ? '#drops' : location.pathname); } catch(e) {}
    render();
  }
  document.querySelector('.views').addEventListener('click', function(e){
    var b = e.target.closest('.view'); if (b) setView(b.dataset.v);
  });
  function chipSet(el, items, key){
    el.innerHTML = items.map(function(it){
      return '<button class="chip" data-v="' + it[0] + '" aria-pressed="' + (state[key] === it[0]) + '">' + it[1] + '</button>';
    }).join('');
    el.addEventListener('click', function(e){
      var b = e.target.closest('.chip'); if (!b) return;
      state[key] = b.dataset.v;
      Array.prototype.forEach.call(el.children, function(c){ c.setAttribute('aria-pressed', c === b); });
      render();
    });
  }
  chipSet($('#modelChips'), [['ALL','전체'],['A6','A6'],['A7','A7'],['G80','G80'],['G70','G70'],['아반떼','아반떼']], 'm');
  chipSet($('#colorChips'), [['검정색','검정'],['쥐색','쥐색'],['흰색','흰색'],['ALL','전체색']], 'c');
  chipSet($('#gradeChips'), [['ALL','전체'],['A','추천'],['B','보통'],['C','비추천']], 'g');
  $('#q').addEventListener('input', function(e){ state.q = e.target.value.trim(); render(); });
  $('#sort').addEventListener('change', function(e){ state.sort = e.target.value; render(); });

  function reasonsOf(c){
    var pro = [], con = [], m;
    c.v.forEach(function(x){
      if (x === '1인소유') pro.push('처음부터 1인 소유');
      else if ((m = x.match(/^소유(\d+)회/))) con.push('주인이 ' + m[1] + '번 바뀜');
      else if (x === '보험이력 0건') pro.push('보험 사고 0건');
      else if ((m = x.match(/^소액사고만 (\d+)건\(내(\d+)\/타(\d+)만\)/)))
        pro.push(+m[2] === 0 ? '사고 ' + m[1] + '건, 내 차 수리 기록 없음' : '사고 ' + m[1] + '건 모두 소액 (내 차 수리 ' + m[2] + '만)');
      else if ((m = x.match(/^중형사고 포함\(최대 (\d+)만\)/))) con.push(m[1] + '만원짜리 사고 이력');
      else if ((m = x.match(/^사고후 (\d+)년 운행/))) pro.push('사고 후 ' + m[1] + '년 문제없이 운행');
      else if ((m = x.match(/^최근 사고\(([\d-]+)\)/))) con.push(m[1] + ' 사고 후 바로 매물로 나옴');
      else if ((m = x.match(/도장비 (\d+)만/))) con.push('부품 교체 없이 도장비만 ' + m[1] + '만 (재도색 의심)');
      else if ((m = x.match(/^자차미가입기간 (\d+)건/))) con.push('자차보험 공백 ' + m[1] + '회 (그 기간 사고는 기록이 안 남음)');
      else if (x.indexOf('완전무사고') === 0) pro.push('차체 교환·판금 없음');
      else if ((m = x.match(/^외판 교환(\d+)\/판금(\d+): \[(.*)\]/)))
        con.push('차체 ' + (+m[1] ? '교환 ' + m[1] + '곳 ' : '') + (+m[2] ? '판금 ' + m[2] + '곳 ' : '') + '(' + m[3].replace(/'/g, '') + ')');
      else if (x === '엔카진단O') pro.push('엔카 정밀진단 통과');
      else if (x === '20만km 초과') con.push('주행 20만km 초과');
    });
    if (c.v.length && !c.v.some(function(x){ return x.indexOf('완전무사고') === 0 || x.indexOf('외판 교환') === 0; }))
      con.push('성능점검기록부가 온라인에 없음 (딜러에게 꼭 받을 것)');
    if (c.k >= 120000 && c.k <= 200000) con.push('주행 ' + (c.k/10000).toFixed(1) + '만km로 많음');
    else if (c.k > 0 && c.k <= 50000) pro.push('주행 ' + (c.k/10000).toFixed(1) + '만km로 적음');
    if (c.pct && c.pct <= 40) pro.push('신차 대비 ' + c.pct + '% 가격');
    return { pro: pro, con: con };
  }

  var cmps = {
    drop: function(a,b){ return dropOf(b) - dropOf(a); },
    score: function(a,b){ return (a.g > b.g) - (a.g < b.g) || b.s - a.s; },
    price: function(a,b){ return a.p - b.p; },
    km: function(a,b){ return a.k - b.k; },
    year: function(a,b){ return (b.y||0) - (a.y||0); },
    pct: function(a,b){ return (a.pct||99) - (b.pct||99); }
  };

  function render(){
    var list = D.cars.filter(function(c){
      return (state.m === 'ALL' || c.m === state.m) &&
             (state.c === 'ALL' || c.c === state.c) &&
             (state.g === 'ALL' || c.g === state.g) &&
             (state.view !== 'drop' || dropOf(c) > 0);
    });
    document.getElementById('dropN').textContent = D.cars.filter(function(c){
      return dropOf(c) > 0 && (state.m === 'ALL' || c.m === state.m) && (state.c === 'ALL' || c.c === state.c);
    }).length;
    if (state.q){
      var q = state.q.toLowerCase();
      list = list.filter(function(c){
        return (c.b + ' ' + c.y + ' ' + (c.r||'') + ' ' + c.i + ' ' + c.m).toLowerCase().indexOf(q) >= 0;
      });
    }
    list = list.slice().sort(cmps[state.sort]);
    $('#hint').textContent = list.length + '대';
    $('#rows').innerHTML = list.slice(0, 200).map(function(c){
      var r = reasonsOf(c);
      var why = (r.pro.length ? '<span class="pro"><b>추천 이유</b>' + r.pro.join(' · ') + '</span>' : '') +
                (r.con.length ? '<span class="con"><b>비추천 이유</b>' + r.con.join(' · ') + '</span>' : '');
      var dep = c.pct
        ? '<span class="t">' + c.pct + '%</span><span class="track"><i style="width:' + Math.max(4, Math.min(100, c.pct)) + '%"></i></span>'
        : '<span class="t">—</span>';
      return '<a class="row" data-i="' + c.i + '" href="https://fem.encar.com/cars/detail/' + c.i + '" target="_blank" rel="noopener">' +
        '<span class="stripe ' + c.g + '"></span>' +
        '<span class="id hide-s">' + c.i + '</span>' +
        '<span class="name"><span class="b">' + c.m + ' ' + c.b + '</span>' +
        '<span class="m">' + c.c + ' · ' + (c.r || '—') + (c.h ? ' <span class="pch">가격변동 ' + nChanges(c.h) + '회</span>' : '') + '</span><span class="why">' + why + '</span></span>' +
        '<span class="num hide-s">' + c.y + '</span>' +
        '<span class="num hide-s">' + (c.k/10000).toFixed(1) + '만</span>' +
        '<span class="price">' + (c.hold ? '<span class="holdtag">계약중</span>' : '') + (state.view === 'drop' && dropOf(c) > 0
          ? '<span class="was">' + (c.p + dropOf(c)).toLocaleString() + '</span>' + c.p.toLocaleString() +
            '<span class="dd">−' + dropOf(c).toLocaleString() + ' (' + Math.round(dropOf(c) / (c.p + dropOf(c)) * 100) + '%)</span>'
          : c.p.toLocaleString()) + '</span>' +
        '<span class="dep hide-s">' + dep + '</span>' +
        '<span class="gr ' + c.g + '">' + ({A:'추천',B:'보통',C:'비추천'})[c.g] + '</span></a>';
    }).join('') || '<div class="empty">조건에 맞는 매물이 없습니다.</div>';
  }

  function changes(h){ var o=[]; for (var k=1;k<h.length;k++) if (h[k][1]!==h[k-1][1]) o.push([h[k][0],h[k-1][1],h[k][1]]); return o; }
  function nChanges(h){ return changes(h).length; }
  var byId = {}; D.cars.forEach(function(c){ byId[c.i] = c; });
  var sp = document.getElementById('spark');
  function md(d){ return d.slice(5).replace('-','/'); }
  function sparkSVG(h){
    var W=272, H=120, L=6, R=6, T=18, B=20;
    var t=function(d){ return new Date(d+'T00:00:00').getTime(); };
    var x0=t(h[0][0]), x1=t(h[h.length-1][0]); if (x1===x0) x1=x0+864e5;
    var ps=h.map(function(p){return p[1];}), lo=Math.min.apply(null,ps), hi=Math.max.apply(null,ps);
    var pad=Math.max((hi-lo)*0.15, hi*0.01); lo-=pad; hi+=pad;
    var X=function(d){ return L+(t(d)-x0)/(x1-x0)*(W-L-R); }, Y=function(v){ return T+(hi-v)/(hi-lo)*(H-T-B); };
    var d='M'+X(h[0][0]).toFixed(1)+','+Y(h[0][1]).toFixed(1);
    for (var k=1;k<h.length;k++){ d+=' H'+X(h[k][0]).toFixed(1)+' V'+Y(h[k][1]).toFixed(1); }
    var dots='';
    for (var k=0;k<h.length;k++) if (k===0 || h[k][1]!==h[k-1][1])
      dots+='<circle cx="'+X(h[k][0]).toFixed(1)+'" cy="'+Y(h[k][1]).toFixed(1)+'" r="4" fill="var(--accent)" stroke="#fff" stroke-width="2"/>';
    var first=h[0], last=h[h.length-1];
    return '<svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true">'+
      '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(H-B)+'" y2="'+(H-B)+'" stroke="var(--line)" stroke-width="1"/>'+
      '<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>'+dots+
      '<text class="lb" x="'+L+'" y="'+(Y(first[1])-8).toFixed(1)+'">'+first[1].toLocaleString()+'</text>'+
      '<text class="lb" text-anchor="end" x="'+(W-R)+'" y="'+(Y(last[1])-8).toFixed(1)+'">'+last[1].toLocaleString()+'</text>'+
      '<text class="ax" x="'+L+'" y="'+(H-4)+'">'+md(first[0])+'</text>'+
      '<text class="ax" text-anchor="end" x="'+(W-R)+'" y="'+(H-4)+'">'+md(last[0])+'</text></svg>';
  }
  function showSpark(row, ev){
    var c = byId[row.dataset.i];
    if (!c || !c.h) { sp.style.display='none'; return; }
    var cs = changes(c.h);
    sp.innerHTML = '<div class="t">가격 변동 ' + cs.length + '회 · 단위 만원</div>' + sparkSVG(c.h) +
      '<ul>' + cs.slice().reverse().map(function(x){ var dn = x[2] < x[1];
        return '<li><span>'+md(x[0])+'</span><span>'+x[1].toLocaleString()+' → '+x[2].toLocaleString()+'</span><span class="'+(dn?'dn':'up')+'">'+(dn?'':'+')+(x[2]-x[1]).toLocaleString()+'</span></li>'; }).join('') + '</ul>';
    sp.style.display='block';
    var r = row.getBoundingClientRect(), w = sp.offsetWidth, hh = sp.offsetHeight;
    var left = ev ? ev.clientX + 18 : r.right - w - 16;
    if (left + w > window.innerWidth - 8) left = ev ? ev.clientX - w - 18 : 8;
    var top = Math.max(8, Math.min(r.top + r.height/2 - hh/2, window.innerHeight - hh - 8));
    sp.style.left = Math.max(8, left) + 'px'; sp.style.top = top + 'px';
  }
  var rowsEl = document.getElementById('rows');
  rowsEl.addEventListener('mousemove', function(e){ var row = e.target.closest('.row'); if (row) showSpark(row, e); else sp.style.display='none'; });
  rowsEl.addEventListener('mouseleave', function(){ sp.style.display='none'; });
  rowsEl.addEventListener('focusin', function(e){ var row = e.target.closest('.row'); if (row) showSpark(row, null); });
  rowsEl.addEventListener('focusout', function(){ sp.style.display='none'; });
  window.addEventListener('scroll', function(){ sp.style.display='none'; }, {passive:true});
  if (location.hash === '#drops') setView('drop'); else render();
})();
</script>
